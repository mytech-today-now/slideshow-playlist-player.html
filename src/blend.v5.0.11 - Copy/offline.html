<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Blend offline</title>
  <style>
    :root {
      color-scheme: dark;
      background: #0a0a0a;
      color: #f5f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0a0a0a;
    }
    main {
      max-width: 520px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #c8d1e3;
      line-height: 1.5;
    }
    a {
      color: #8fd4ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Blend is offline</h1>
    <p>The app shell should open again from cache. Remote media, private links, and pages that were never cached need a network connection.</p>
  </main>
</body>
</html>
