services:
  - type: web
    name: blend-profile-sync-api
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: src/blend.v5.0.11 - Copy
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /healthz
    autoDeployTrigger: off
    domains:
      - api.mytech.today
    envVars:
      - key: NODE_ENV
        value: production
      - key: BLEND_PROFILE_SYNC_ALLOWED_ORIGINS
        sync: false
      - key: BLEND_PROFILE_SYNC_FRONTEND_ORIGIN
        sync: false
      - key: BLEND_PROFILE_SYNC_FRONTEND_URL
        sync: false
      - key: BLEND_PROFILE_SYNC_COOKIE_SAME_SITE
        value: Strict
      - key: BLEND_PROFILE_SYNC_TOKEN_PEPPER
        generateValue: true
      - key: BLEND_PROFILE_SYNC_GITHUB_TOKEN
        sync: false
      - key: BLEND_PROFILE_SYNC_GITHUB_BRANCH
        value: main
      - key: BLEND_PROFILE_SYNC_ADMIN_KEY_SHA256
        sync: false
      - key: BLEND_PROFILE_SYNC_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: blend-profile-sync-db
          property: connectionString

databases:
  - name: blend-profile-sync-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: blend_profile_sync
    user: blend_profile_sync
    postgresMajorVersion: "16"
    ipAllowList: []
